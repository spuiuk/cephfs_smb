---
- name: import variables
  ansible.builtin.import_role:
    name: import_config

- block:
  - name: RHEL based distros should have custom repo set
    ansible.builtin.fail:
      msg: "RHEL based distros should have custom ceph repo set"
    when: CEPH_REPO is undefined
  - name: Enable extra repos
    ansible.builtin.shell:
      cmd: |
        subscription-manager register
        subscription-manager refresh
        subscription-manager repos --enable=rhel-9-for-x86_64-baseos-rpms --enable=rhel-9-for-x86_64-appstream-rpms
  when: DISTRO == "rhel-9" or DISTRO == "rhel-10"

- name: Update hosts
  ansible.builtin.dnf:
    name: "*"
    state: latest

- name: Install Ceph Custom Repo
  ansible.builtin.shell: dnf config-manager --add-repo {{ CEPH_REPO }}
  when: CEPH_REPO is defined and CEPH_REPO|length > 0

- block:
  - name: Set CEPH_REPO for upstream
    ansible.builtin.set_fact:
      ceph_shaman_distro: >-
        {{ ('rocky' if ansible_facts["distribution_major_version"] | int >= 10
           else ansible_facts["distribution_major_version"]) ~ '/' ~ ansible_facts["distribution_major_version"] }}
  - name: Build latest Shaman branch
    ansible.builtin.uri:
      url: "https://shaman.ceph.com/api/search?\
            project=ceph&\
            ref={{ CEPH_BRANCH }}&\
            flavor=default&\
            status=ready&\
            distros={{ ceph_shaman_distro }}/x86_64&\
            sha1=latest"
      return_content: true
    register: ceph_shaman
  - name: Create ceph repo
    ansible.builtin.yum_repository:
      name: "ceph-{{ CEPH_BRANCH }}-{{ ceph_shaman.json[0].sha1 }}"
      baseurl: "{{ ceph_shaman.json[0].url }}/x86_64"
      description: "Ceph {{ CEPH_BRANCH }} ({{ ceph_shaman.json[0].sha1 }})"
      enabled: true
      gpgcheck: false
      state: present
  vars:
    CEPH_BRANCH: "main"
  when: CEPH_REPO is undefined

# This is not available for RHEL based systems
- name: Install Ceph Tentacle Repo
  ansible.builtin.dnf:
    name: centos-release-ceph-tentacle
    state: present
  when: CEPH_REPO is undefined or CEPH_REPO|length == 0


- name: Create parent directory for IBM license file
  ansible.builtin.file:
    path: /usr/share/ibm-storage-ceph-license/
    state: directory

- name: Create IBM license file
  ansible.builtin.file:
    path: /usr/share/ibm-storage-ceph-license/accept
    state: touch

- block:
    - name: Install epel-release for Centos 10
      ansible.builtin.dnf:
        name:
          - epel-release
        state: present
  when: DISTRO == "centos-10"

- name: Install required packages on hosts
  ansible.builtin.dnf:
    name:
      - podman
      - python3-pyyaml
      - python3-pip
      - ceph-common
      - python3-jinja2
      - lvm2
      - firewalld
    state: latest

- name: Start firewalld service
  ansible.builtin.service:
    name: firewalld
    state: started

- name: Enable ceph firewalld ports
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - ceph
    - ceph-mon
    - ceph-exporter

- name: Update ssh config
  ansible.builtin.copy:
    dest: "/root/.ssh/config"
    mode: 0600
    content: |
      Host mycephfs??
        StrictHostKeyChecking no
        UpdateHostKeys yes
