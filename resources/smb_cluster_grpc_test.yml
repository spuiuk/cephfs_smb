# Requirements: Install grpcurl as client to obtain information
# curl -LO   https://github.com/fullstorydev/grpcurl/releases/download/v1.8.9/grpcurl_1.8.9_linux_x86_64.tar.gz
# tar -xvzf grpcurl_1.8.9_linux_x86_64.tar.gz
# chmod +x grpcurl
# sudo mv grpcurl /usr/local/bin/
# grpcurl --version

# Test:
# grpcurl -cacert ~/resources/certs/ca/ca.crt -cert ~/resources/certs/mycephfs11/mycephfs11.crt -key ~/resources/certs/mycephfs11/mycephfs11.key 192.168.145.11:54445 SambaControl/Status
resources:
  - resource_type: ceph.smb.cluster
    cluster_id: mysmb
    auth_mode: user
    user_group_settings:
      - source_type: resource
        ref: ug1
    remote_control:
      cert: {ref: cert1}
      key: {ref: key1}
      ca_cert: {ref: cacert1}
    placement:
      hosts:
        - "mycephfs11"

  - resource_type: ceph.smb.usersgroups
    users_groups_id: ug1
    values:
      users:
        - name: test1
          password: x
        - name: test2
          password: x
      groups: []

  - resource_type: ceph.smb.share
    cluster_id: mysmb
    share_id: mysmb-root
    intent: present
    name: mysmb-root
    readonly: false
    browseable: true
    cephfs:
      volume: mycephfs
      subvolume: smbshares
      path: /
      provider: samba-vfs

