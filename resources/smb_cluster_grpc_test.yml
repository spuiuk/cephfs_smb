# grpcurl -cacert certs/ca/ca.crt -cert certs/mycephfs11/mycephfs11.crt -key certs/mycephfs11/mycephfs11.key 192.168.145.11:54445 SambaControl/Status
resources:
  - resource_type: ceph.smb.cluster
    cluster_id: mysmb
    auth_mode: user
    user_group_settings:
      - source_type: resource
        ref: ug1
    remote_control:
      cert: {ref: cert1}
      key: {ref: key1}
      ca_cert: {ref: cacert1}
    placement: { label: "mysmb" }

  - resource_type: ceph.smb.usersgroups
    users_groups_id: ug1
    values:
      users:
        - name: test1
          password: x
        - name: test2
          password: x
      groups: []

  - resource_type: ceph.smb.share
    cluster_id: mysmb
    share_id: mysmb-root
    intent: present
    name: mysmb-root
    readonly: false
    browseable: true
    cephfs:
      volume: mycephfs
      subvolume: smbshares
      path: /
      provider: samba-vfs

